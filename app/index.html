<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=1920">
<title>Pulse Sport TV</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#06070b;--text:#f3f5f9;--sub:#b7bdcc;--muted:#7d8499;--live:#ff3355;--soon:#ffb547;--ok:#35d58a;--line:rgba(255,255,255,.08)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;width:1920px;height:1080px;overflow:hidden;-webkit-font-smoothing:antialiased}
.d{font-family:"Barlow Condensed",Impact,sans-serif;font-weight:800;text-transform:uppercase;letter-spacing:.3px}
/* hero art bleeds behind the header, Netflix-style */
#heroart{position:absolute;left:0;top:0;width:1920px;height:760px;overflow:hidden}
#heroart img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.2s ease,transform 12s linear;transform:scale(1.06)}
#heroart img.on{opacity:1;transform:scale(1)}
#heroart::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#06070b 0%,rgba(6,7,11,.92) 30%,rgba(6,7,11,.35) 65%,rgba(6,7,11,.2) 100%),linear-gradient(180deg,rgba(6,7,11,.75) 0%,rgba(6,7,11,0) 22%,rgba(6,7,11,0) 55%,#06070b 100%)}
header{position:absolute;left:96px;right:96px;top:44px;height:64px;display:flex;align-items:center;gap:56px;z-index:3}
.logo{font-size:44px;display:flex;align-items:center;gap:12px}
.logo i{width:13px;height:13px;border-radius:50%;background:var(--live);box-shadow:0 0 18px var(--live);animation:beat 1.6s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.4);opacity:.75}}
nav{display:flex;gap:40px;align-items:center;height:64px}
.tab{position:relative;font-size:25px;font-weight:600;color:var(--muted);padding:8px 0;white-space:nowrap;transition:color .2s}
.tab.on{color:var(--text)}
.tab.on::after{content:"";position:absolute;left:0;right:0;bottom:-4px;height:3px;border-radius:2px;background:var(--live)}
.tab.f{color:#fff;text-shadow:0 0 18px rgba(255,255,255,.55)}
.tab.f::before{content:"";position:absolute;inset:-6px -16px;border-radius:12px;background:rgba(255,255,255,.12)}
.right{margin-left:auto;display:flex;align-items:center;gap:30px}
.clock{font-size:32px;color:var(--sub)}
.gear{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--sub)}
.gear.f{background:rgba(255,255,255,.16);color:#fff}
#hero{position:absolute;left:96px;top:190px;width:1150px;z-index:2}
.eyebrow{display:flex;align-items:center;gap:12px;font-size:22px;font-weight:700;letter-spacing:3px;color:var(--sub);text-transform:uppercase}
.sdot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
#hero h1{font-size:96px;line-height:.92;margin:16px 0 22px;text-shadow:0 4px 30px rgba(0,0,0,.5)}
.meta{display:flex;align-items:center;gap:16px;font-size:25px;color:var(--sub)}
.st{display:inline-flex;align-items:center;gap:9px;font-weight:700;letter-spacing:1.5px;font-size:21px}
.st.live{color:var(--live)}.st.live b{width:10px;height:10px;border-radius:50%;background:var(--live);animation:beat 1.4s infinite}
.st.soon{color:var(--soon)}
.svcl{display:flex;align-items:center;gap:10px;color:var(--sub)}
.gdot{width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px rgba(53,213,138,.7);flex:0 0 auto}
.rows{position:absolute;left:0;right:0;top:612px;bottom:0;overflow:hidden;z-index:2}
.rowsin{transition:transform .4s cubic-bezier(.2,.8,.2,1)}
.row{margin-bottom:30px}
.row h2{font-size:34px;margin:0 0 4px 96px;display:flex;gap:14px;align-items:baseline}
.row h2 span{font-family:Inter;font-size:20px;color:var(--muted);font-weight:600}
.track{display:flex;gap:26px;padding:18px 96px 22px;transition:transform .4s cubic-bezier(.2,.8,.2,1)}
.card{flex:0 0 420px;height:236px;border-radius:18px;position:relative;overflow:hidden;background:#11131b;transition:transform .25s ease,box-shadow .25s ease}
.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .6s ease}
.card .sh{position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,7,11,.25) 0%,rgba(6,7,11,.1) 30%,rgba(6,7,11,.92) 100%)}
.card .tx{position:absolute;left:24px;right:24px;bottom:20px}
.card .lg{position:absolute;top:18px;left:24px;right:24px;display:flex;align-items:center;gap:10px;font-size:16px;font-weight:700;letter-spacing:2.2px;color:#e3e6ee;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card h3{font-size:36px;line-height:.98;max-height:72px;overflow:hidden;text-shadow:0 2px 12px rgba(0,0,0,.6)}
.card .m{display:flex;align-items:center;gap:12px;font-size:19px;color:#e6e8ef;margin-top:10px;white-space:nowrap;overflow:hidden}
.card .m .svcl{font-size:17px;overflow:hidden;text-overflow:ellipsis}
.card .bar{position:absolute;left:0;bottom:0;height:5px;background:var(--live);box-shadow:0 0 12px var(--live)}
.card::after{content:"";position:absolute;inset:0;border-radius:18px;box-shadow:inset 0 0 0 1px var(--line);pointer-events:none}
.card.f{transform:scale(1.08);box-shadow:0 24px 70px rgba(0,0,0,.7),0 0 0 4px #fff;z-index:2}
.card.f img{transform:scale(1.05)}
#detail,#setup{position:absolute;inset:0;display:none;z-index:10;background:#06070b}
#detail.open,#setup.open{display:block}
#detail .art{position:absolute;inset:0}
#detail .art img{width:100%;height:100%;object-fit:cover;filter:saturate(1.1)}
#detail .art::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#06070b 0%,rgba(6,7,11,.94) 42%,rgba(6,7,11,.5) 100%),linear-gradient(0deg,#06070b 0%,rgba(6,7,11,0) 50%)}
#detail .in{position:absolute;left:120px;top:120px;width:1200px}
#detail h1{font-size:118px;line-height:.9;margin:18px 0 24px}
.wh{font-size:30px;margin:64px 0 6px}
.hint{font-size:22px;color:var(--muted)}
.svcs{display:flex;flex-wrap:wrap;gap:22px;margin-top:26px}
.tile{width:300px;height:130px;border-radius:18px;background:rgba(255,255,255,.07);backdrop-filter:blur(8px);padding:22px 26px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:inset 0 0 0 1px var(--line);transition:transform .2s}
.tile b{font-size:30px;font-weight:700;line-height:1.05}
.tile span{font-size:18px;color:var(--sub);display:flex;align-items:center;gap:8px}
.tile.f{transform:scale(1.06);box-shadow:0 0 0 4px #fff,0 18px 50px rgba(0,0,0,.6);background:rgba(255,255,255,.14)}
.foot{position:absolute;left:120px;bottom:70px;font-size:22px;color:var(--muted)}
#setup{padding:120px 140px;background:radial-gradient(120% 90% at 85% 0%,#1a1f35 0%,#06070b 60%)}
#setup h1{font-size:96px;margin-bottom:8px}#setup p{font-size:28px;color:var(--sub);margin:40px 0 18px}
.opts{display:flex;flex-wrap:wrap;gap:14px 34px;max-width:1640px}
.opt{display:flex;align-items:center;gap:14px;font-size:28px;font-weight:600;color:var(--sub);padding:12px 18px;border-radius:14px}
.opt i{width:26px;height:26px;border-radius:50%;box-shadow:inset 0 0 0 2px #5b6276;flex:0 0 auto}
.opt.sel{color:#fff}.opt.sel i{background:var(--ok);box-shadow:0 0 14px rgba(53,213,138,.6)}
.opt.f{background:rgba(255,255,255,.12);color:#fff}
.go{margin-top:54px;display:inline-block;padding:20px 54px;border-radius:14px;background:var(--live);font-size:30px;font-weight:700}
.go.f{box-shadow:0 0 0 4px #fff;transform:scale(1.05)}
.empty{font-size:30px;color:var(--muted);padding:30px 96px}
.skel{position:absolute;left:96px;top:640px;display:flex;gap:26px}
.skel div{width:420px;height:236px;border-radius:18px;background:linear-gradient(90deg,#10121a,#1a1d29,#10121a);background-size:200% 100%;animation:sk 1.4s infinite}
@keyframes sk{to{background-position:-200% 0}}
</style><script>window.PULSE_BASE="https://pulsesports.stream";</script><script src="$WEBAPIS/webapis/webapis.js"></script><script src="prov.js"></script></head><body>
<div id="heroart"></div>
<header><div class="logo d"><i></i>Pulse</div><nav id="nav"></nav><div class="right"><div class="clock d" id="clock"></div><div class="gear" id="gear"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></div></div></header>
<div id="hero"><div class="eyebrow">&nbsp;</div><h1 class="d">Loading the guide</h1></div>
<div class="skel" id="skel"><div></div><div></div><div></div><div></div></div>
<div class="rows"><div class="rowsin" id="rows"></div></div>
<div id="detail"></div><div id="setup"></div>
<script>
(function(){
var BASE=window.PULSE_BASE||"",H=window.PulseHooks||{};
var COL={FOOTBALL:"#1fb86a",LEAGUE:"#2fa4ff",RUGBY:"#14b8a6",FIGHTING:"#ff3b5c",BASKETBALL:"#f2b33d",MOTORSPORT:"#ff8a1f",AMFOOTBALL:"#3d6bff",CRICKET:"#8bc34a",TENNIS:"#cde04a",GOLF:"#4cc38a",CUE:"#ff6f91",HOCKEY:"#7fd3ff",BASEBALL:"#e85d75",WRESTLING:"#b04dff",OTHER:"#9aa6ff"};
var LAB={FOOTBALL:"Football",LEAGUE:"Rugby League",RUGBY:"Rugby",FIGHTING:"Fights",BASKETBALL:"Basketball",MOTORSPORT:"Motorsport",AMFOOTBALL:"NFL",CRICKET:"Cricket",TENNIS:"Tennis",GOLF:"Golf",CUE:"Darts",HOCKEY:"Hockey",BASEBALL:"Baseball",WRESTLING:"Wrestling",OTHER:"More"};
var REG=[["NZ","New Zealand"],["AU","Australia"],["UK","United Kingdom"],["IE","Ireland"],["US","United States"],["CA","Canada"]];
function ls(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem("pulse_tv_"+k));localStorage.setItem("pulse_tv_"+k,JSON.stringify(v))}catch(e){return null}}
function guess(){var z="";try{z=Intl.DateTimeFormat().resolvedOptions().timeZone||""}catch(e){}
  return z.indexOf("Auckland")>=0?"NZ":z.indexOf("Australia")>=0?"AU":z.indexOf("London")>=0?"UK":z.indexOf("Dublin")>=0?"IE":/Toronto|Vancouver|Edmonton|Winnipeg|Halifax/.test(z)?"CA":z.indexOf("America")>=0?"US":"NZ"}
var S={region:ls("region")||guess(),mine:ls("mine")||[],data:null,tab:"all",rows:[],ri:0,ci:[],zone:"rows",ti:0,hero:0};
var $=function(s){return document.querySelector(s)};
function el(t,c,h){var e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e}
function esc(s){return String(s||"").replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function st(g,now){return now>=g.start&&now<g.end?"live":now>=g.end?"ended":g.start-now<=2*3600000?"soon":"later"}
function clock(ms){return new Date(ms).toLocaleTimeString([], {hour:"numeric",minute:"2-digit"})}
function when(g,now){var s=st(g,now),d=new Date(g.start);
  if(s==="live")return Math.max(1,Math.round((now-g.start)/60000))+" min in";
  if(s==="soon")return "In "+Math.max(1,Math.round((g.start-now)/60000))+" min";
  var day=new Date(now).toDateString()===d.toDateString()?"Today":new Date(now+86400000).toDateString()===d.toDateString()?"Tomorrow":d.toLocaleDateString([], {weekday:"short"});
  return day+" "+clock(g.start)}
function stat(g,now){var s=st(g,now);return s==="live"?'<span class="st live"><b></b>LIVE</span>':s==="soon"?'<span class="st soon">SOON</span>':""}
function league(g){return g.league||LAB[g.sport]||"Sport"}
function svcs(g){var by={};(S.data.services||[]).forEach(function(s){by[s.id]=s});return g.watch.map(function(id){return by[id]}).filter(Boolean)}
function mine(g){for(var i=0;i<g.watch.length;i++)if(S.mine.indexOf(g.watch[i])>=0)return true;return false}
function svcLine(g){var v=svcs(g);if(!v.length)return "";v.sort(function(a,b){return(S.mine.indexOf(b.id)>=0)-(S.mine.indexOf(a.id)>=0)});
  return '<span class="svcl">'+(mine(g)?'<i class="gdot"></i>':'')+esc(v.slice(0,3).map(function(x){return x.name}).join(" · "))+'</span>'}
function get(cb){var x=new XMLHttpRequest();x.open("GET",BASE+"/api/tv?region="+S.region);x.onload=function(){try{S.data=JSON.parse(x.responseText);cb()}catch(e){fail()}};x.onerror=fail;x.send()}
function fail(){$("#rows").innerHTML='<div class="empty">Couldn&#39;t load the guide. Trying again shortly.</div>';setTimeout(function(){get(build)},30000)}
function build(){
  $("#skel").style.display="none";
  var now=Date.now(),gs=S.data.games.filter(function(g){return st(g,now)!=="ended"});
  var sports=[];gs.forEach(function(g){if(sports.indexOf(g.sport)<0)sports.push(g.sport)});
  sports.sort(function(a,b){return gs.filter(function(g){return g.sport===b}).length-gs.filter(function(g){return g.sport===a}).length});
  S.tabs=[["all","Home"],["live","Live"]].concat(sports.slice(0,7).map(function(s){return[s,LAB[s]||s]}));
  if(H.tabs)H.tabs(S.tabs);
  var nav=$("#nav");nav.innerHTML="";S.tabs.forEach(function(t){nav.appendChild(el("div","tab"+(S.tab===t[0]?" on":""),esc(t[1])))});
  var f=S.tab==="all"?gs:S.tab==="live"?gs.filter(function(g){return st(g,now)==="live"}):gs.filter(function(g){return g.sport===S.tab});
  var rows=[],end=new Date(now);end.setHours(23,59,0,0);
  var yours=f.filter(function(g){return mine(g)&&g.start<now+18*3600000});if(S.mine.length&&yours.length&&S.tab==="all")rows.push(["On your services",yours]);
  var live=f.filter(function(g){return st(g,now)==="live"});if(live.length)rows.push(["Live now",live]);
  var soon=f.filter(function(g){return st(g,now)==="soon"});if(soon.length)rows.push(["Starting soon",soon]);
  var today=f.filter(function(g){return st(g,now)==="later"&&g.start<=end.getTime()});if(today.length)rows.push(["Later today",today]);
  var tmr=f.filter(function(g){return g.start>end.getTime()});if(tmr.length)rows.push(["Tomorrow",tmr]);
  S.rows=rows.map(function(r){return[r[0],r[1].slice(0,30)]});var hr=H.rows&&H.rows(S.tab);if(hr)S.rows=hr;
  var box=$("#rows");box.innerHTML="";
  if(!S.rows.length)box.innerHTML='<div class="empty">Nothing on in the next day and a half.</div>';
  S.rows.forEach(function(r){var row=el("div","row");row.appendChild(el("h2","d",esc(r[0])+" <span>"+r[1].length+"</span>"));var tr=el("div","track");
    r[1].forEach(function(g){tr.appendChild(g.ch?H.card(g):card(g,now))});row.appendChild(tr);box.appendChild(row)});
  S.ci=S.rows.map(function(_,i){return Math.min(S.ci[i]||0,S.rows[i][1].length-1)});S.ri=Math.min(S.ri,Math.max(0,S.rows.length-1));
  var big=hr?[]:live.concat(soon);if(!big.length&&!hr)big=f.slice(0,3);S.heroes=big.slice(0,6);if(S.heroes[0])showHero(S.heroes[0]);focus()}
function card(g,now){var s=st(g,now),c=el("div","card");
  c.innerHTML='<img loading="lazy" alt="" src="'+esc(BASE+g.img)+'"><div class="sh"></div><div class="lg"><i class="sdot" style="background:'+(COL[g.sport]||COL.OTHER)+'"></i>'+esc(league(g))+'</div>'+
    '<div class="tx"><h3 class="d">'+esc(g.title)+'</h3><div class="m">'+stat(g,now)+'<span>'+esc(when(g,now))+'</span>'+svcLine(g)+'</div></div>'+
    (s==="live"?'<div class="bar" style="width:'+Math.min(100,(now-g.start)/(g.end-g.start)*100)+'%"></div>':'');
  return c}
var heroImg=null;
function showHero(g){if(!g)return;if(g.ch){if(H.hero)H.hero(g);return}var now=Date.now(),a=$("#heroart"),im=new Image();im.alt="";S.want=g.img;im.onload=function(){if(S.want!==g.img)return;a.appendChild(im);setTimeout(function(){im.className="on"},30);var old=heroImg;heroImg=im;if(old)setTimeout(function(){old.remove()},1300)};im.src=BASE+g.img;
  $("#hero").innerHTML='<div class="eyebrow"><i class="sdot" style="background:'+(COL[g.sport]||COL.OTHER)+'"></i>'+esc(league(g))+'</div><h1 class="d">'+esc(g.title)+'</h1><div class="meta">'+stat(g,now)+'<span>'+esc(when(g,now))+'</span>'+svcLine(g)+'</div>'}
setInterval(function(){if(S.zone==="rows"&&S.heroes&&S.heroes.length>1){S.hero=(S.hero+1)%S.heroes.length;showHero(S.heroes[S.hero])}},10000);
function focus(){var fs=document.querySelectorAll(".f");for(var i=0;i<fs.length;i++)fs[i].classList.remove("f");
  if(S.zone==="nav"){var t=$("#nav").children[S.ti];if(t)t.classList.add("f");else $("#gear").classList.add("f");$(".rowsin").style.transform="translateY(0)";return}
  var row=$("#rows").children[S.ri];if(!row)return;var tr=row.querySelector(".track");if(!tr)return;var c=tr.children[S.ci[S.ri]];if(c)c.classList.add("f");
  tr.style.transform="translateX("+(-Math.max(0,S.ci[S.ri]-2)*446)+"px)";$(".rowsin").style.transform="translateY("+(-row.offsetTop)+"px)";
  if(c){var g=S.rows[S.ri][1][S.ci[S.ri]];clearTimeout(S.ht);S.ht=setTimeout(function(){showHero(g)},450)}}
function open(g){if(g.ch){H.play(g);return}var now=Date.now(),d=$("#detail"),v=svcs(g).sort(function(a,b){return(S.mine.indexOf(b.id)>=0)-(S.mine.indexOf(a.id)>=0)});
  d.innerHTML='<div class="art"><img alt="" src="'+esc(BASE+g.img)+'"></div><div class="in"><div class="eyebrow"><i class="sdot" style="background:'+(COL[g.sport]||COL.OTHER)+'"></i>'+esc(league(g))+'</div>'+
    '<h1 class="d">'+esc(g.title)+'</h1><div class="meta">'+stat(g,now)+'<span>'+esc(when(g,now))+'</span><span>Starts '+esc(clock(g.start))+'</span></div>'+
    (H.watch?H.watch(g):"")+'<div class="wh d">Where it&#39;s on</div>'+(g.usual?'<div class="hint">Usually on these in your country this season</div>':'')+
    '<div class="svcs">'+(v.length?v.map(function(x,i){var m=S.mine.indexOf(x.id)>=0;return '<div class="tile'+(i===0?" f":"")+'"><b>'+esc(x.name)+'</b><span>'+(m?'<i class="gdot"></i>Your service':esc(x.note||"Streaming service"))+'</span></div>'}).join(""):'<div class="hint">No broadcaster listed for your country yet.</div>')+'</div></div>'+
    '<div class="foot">Open the service&#39;s app on this TV to watch &nbsp;·&nbsp; Back to return</div>';
  d.classList.add("open");S.zone="detail";S.di=0}
function setup(first){var d=$("#setup");S.zone="setup";S.si=S.si||0;
  S.sdraw=function(){var offer=(S.data?S.data.services:[]).filter(function(s){return s.c.indexOf(S.region)>=0||s.c.indexOf("*")>=0});
    d.innerHTML='<h1 class="d">'+(first?"Welcome to Pulse":"Settings")+'</h1><div class="hint" style="font-size:26px">Every game, and where to watch it.</div><p>Where are you watching from?</p><div class="opts">'+REG.map(function(r){return '<div class="opt'+(S.region===r[0]?" sel":"")+'" data-r="'+r[0]+'"><i></i>'+r[1]+'</div>'}).join("")+'</div>'+
      '<p>What do you already pay for?</p><div class="opts">'+offer.map(function(s){return '<div class="opt'+(S.mine.indexOf(s.id)>=0?" sel":"")+'" data-s="'+s.id+'"><i></i>'+esc(s.name)+'</div>'}).join("")+'</div><div class="go" data-go="1">Done</div>';
    S.sitems=d.querySelectorAll(".opt,.go");S.si=Math.min(S.si,S.sitems.length-1);if(S.sitems[S.si])S.sitems[S.si].classList.add("f")};
  S.sdraw();d.classList.add("open")}
function closeSetup(){$("#setup").classList.remove("open");ls("region",S.region);ls("mine",S.mine);ls("seen",1);S.zone="rows";get(build)}
